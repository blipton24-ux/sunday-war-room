[project]
name = "swr-api"
version = "0.1.0"
description = "Sunday War Room API server and background worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "arq>=0.26",
  "httpx>=0.28",
  "pyjwt>=2.10",
  "cryptography>=44",  # Fernet: encrypts stored platform credentials (ADR-052)
  "structlog>=24.4",
  "numpy>=2.1",
  "pandas>=2.2",
  # Windows: the default Polars build hangs at import on some CPUs, so Windows machines get the
  # compatibility build. Linux (the Docker image, CI, production) gets the standard one.
  "polars>=1.12; sys_platform != 'win32'",
  "polars[rtcompat]>=1.12; sys_platform == 'win32'",
  "pyarrow>=18",
  "nflreadpy>=0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "pandas-stubs",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs the test Postgres/Redis (docker compose up -d db redis)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the idiom

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
# nflreadpy is untyped, so frames derived from it are Any; the schema contracts check them.
module = ["app.sources.nflverse"]
warn_return_any = false

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async mode runs code in greenlets; without this the report misses most of it.
concurrency = ["thread", "greenlet"]
omit = ["app/scripts/*"]  # command-line tools; the backtest is exercised by running it

[tool.coverage.report]
exclude_also = ['if TYPE_CHECKING:', 'raise AssertionError']
