<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Offline · Sunday War Room</title>
<style>
  /* Self-contained on purpose: this page is shown when nothing else can load (ADR-038). */
  :root { color-scheme: dark light; --base:#0b1016; --raised:#141e28; --ink:#efe8da; --ink-lo:#8d99a6; --accent:#e6b95c; --on-accent:#1b1406; }
  @media (prefers-color-scheme: light) { :root { --base:#f4efe4; --raised:#fffaf0; --ink:#16202b; --ink-lo:#66717d; --accent:#a8761c; --on-accent:#fffaf0; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; background:var(--base); color:var(--ink);
         font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:22rem; text-align:center; background:var(--raised); border-radius:1.25rem; padding:28px 22px; }
  .mark { width:56px; height:56px; margin:0 auto 14px; border-radius:50%; display:grid; place-items:center; background:rgba(230,185,92,.15); color:var(--accent); }
  h1 { margin:0 0 8px; font-size:1.25rem; font-weight:900; }
  p { margin:0 0 20px; color:var(--ink-lo); font-size:.92rem; line-height:1.45; }
  button { width:100%; min-height:48px; border:0; border-radius:14px; font:inherit; font-weight:800; cursor:pointer; background:var(--accent); color:var(--on-accent); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16.2a5 5 0 0 1 7 0"/><path d="M12 20h.01"/><path d="m3 3 18 18"/></svg>
  </div>
  <h1>You're offline</h1>
  <p>Sunday War Room needs a connection to load your league. Your leagues and settings are safe. Check your signal and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
